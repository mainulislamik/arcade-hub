<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arcadex HTML5 Web Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #0f172a;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-container {
      position: relative; width: 100%; height: 100%; max-width: 960px; max-height: 720px;
      display: flex; align-items: center; justify-content: center; background: #000;
    }
    canvas {
      width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated;
    }
    #hud {
      position: absolute; top: 12px; left: 16px; right: 16px; display: flex;
      justify-content: space-between; align-items: center; pointer-events: none;
      color: #38bdf8; font-weight: 700; font-size: 14px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .hud-chip {
      background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px; border-radius: 6px; backdrop-filter: blur(4px);
    }
    #game-over-overlay {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; z-index: 50; text-align: center; padding: 20px;
    }
    #game-over-overlay h1 { font-size: 32px; color: #f43f5e; margin-bottom: 8px; }
    #game-over-overlay p { font-size: 16px; color: #94a3b8; margin-bottom: 20px; }
    #restart-btn {
      background: #0284c7; color: #fff; border: none; padding: 10px 24px;
      font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
    #restart-btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="640" height="480"></canvas>
    <div id="hud">
      <div class="hud-chip" id="title-chip">Arcadex Retro Arcade</div>
      <div class="hud-chip" id="score-chip">SCORE: 0</div>
      <div class="hud-chip" id="lives-chip">LIVES: 3</div>
    </div>
    <div id="game-over-overlay">
      <h1 id="overlay-title">GAME OVER</h1>
      <p id="overlay-msg">FINAL SCORE: <span id="final-score">0</span></p>
      <button id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const gameTitle = urlParams.get('title') || 'Arcade Adventure';
    document.getElementById('title-chip').textContent = gameTitle;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let score = 0;
    let lives = 3;
    let gameOver = false;
    let frame = 0;

    // Web Audio Sound Generator
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playBeep(freq, type = 'square', duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Player State
    const player = {
      x: 300,
      y: 410,
      w: 40,
      h: 24,
      speed: 6,
      dx: 0,
      bullets: []
    };

    // Enemies & Stars
    const enemies = [];
    const stars = Array.from({ length: 45 }, () => ({
      x: Math.random() * 640,
      y: Math.random() * 480,
      speed: 0.5 + Math.random() * 2,
      size: Math.random() * 2 + 1
    }));

    function spawnEnemy() {
      if (enemies.length >= 12 || Math.random() > 0.04) return;
      enemies.push({
        x: 40 + Math.random() * 560,
        y: -30,
        w: 32,
        h: 24,
        speed: 1.5 + Math.random() * 2,
        hp: 1,
        color: ['#f43f5e', '#a855f7', '#fbbf24', '#38bdf8'][Math.floor(Math.random() * 4)]
      });
    }

    // Input Handling
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
      if (e.key === ' ' || e.key.toLowerCase() === 'z') {
        shoot();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    // Cross-frame PostMessage Support for Mobile Keypad, Gamepad, Audio Resume, and Focus
    window.addEventListener('message', (event) => {
      if (!event.data) return;
      if (event.data.type === 'RESUME_AUDIO') {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return;
      }
      if (event.data.type === 'REFOCUS') {
        canvas.focus();
        return;
      }
      const { type, key, code, eventType } = event.data;
      const keyName = (key || code || '').toLowerCase();
      const isDown = type === 'keydown' || eventType === 'keydown' || type === 'EMULATOR_KEY' && eventType === 'keydown';
      const isUp = type === 'keyup' || eventType === 'keyup' || type === 'EMULATOR_KEY' && eventType === 'keyup';

      if (isDown) {
        keys[keyName] = true;
        if (keyName === ' ' || keyName === 'space' || keyName === 'action' || keyName === 'fire' || keyName === 'z' || keyName === 'x') {
          shoot();
        }
      } else if (isUp) {
        keys[keyName] = false;
      }
    });

    window.addEventListener('pointerdown', () => {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      canvas.focus();
    });

    function shoot() {
      if (gameOver) return;
      if (player.bullets.length < 6) {
        player.bullets.push({ x: player.x + player.w / 2 - 2, y: player.y - 4, w: 4, h: 10, speed: 8 });
        playBeep(580, 'triangle', 0.06);
      }
    }

    function resetGame() {
      score = 0;
      lives = 3;
      gameOver = false;
      enemies.length = 0;
      player.bullets.length = 0;
      player.x = 300;
      document.getElementById('game-over-overlay').style.display = 'none';
      document.getElementById('score-chip').textContent = 'SCORE: 0';
      document.getElementById('lives-chip').textContent = 'LIVES: 3';
    }

    document.getElementById('restart-btn').addEventListener('click', resetGame);

    // Main Game Loop
    function update() {
      if (gameOver) return;
      frame++;

      // Player Movement
      if (keys['arrowleft'] || keys['a'] || keys['left']) player.x -= player.speed;
      if (keys['arrowright'] || keys['d'] || keys['right']) player.x += player.speed;
      player.x = Math.max(10, Math.min(640 - player.w - 10, player.x));

      // Update Bullets
      for (let i = player.bullets.length - 1; i >= 0; i--) {
        const b = player.bullets[i];
        b.y -= b.speed;
        if (b.y < -10) player.bullets.splice(i, 1);
      }

      // Spawn & Update Enemies
      spawnEnemy();
      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        en.y += en.speed;

        // Collision with player
        if (
          en.x < player.x + player.w &&
          en.x + en.w > player.x &&
          en.y < player.y + player.h &&
          en.y + en.h > player.y
        ) {
          enemies.splice(i, 1);
          lives--;
          document.getElementById('lives-chip').textContent = `LIVES: ${lives}`;
          playBeep(180, 'sawtooth', 0.2);
          if (lives <= 0) {
            gameOver = true;
            document.getElementById('final-score').textContent = score;
            document.getElementById('game-over-overlay').style.display = 'flex';
          }
          continue;
        }

        // Collision with bullets
        for (let j = player.bullets.length - 1; j >= 0; j--) {
          const b = player.bullets[j];
          if (
            b.x < en.x + en.w &&
            b.x + b.w > en.x &&
            b.y < en.y + en.h &&
            b.y + b.h > en.y
          ) {
            enemies.splice(i, 1);
            player.bullets.splice(j, 1);
            score += 100;
            document.getElementById('score-chip').textContent = `SCORE: ${score}`;
            playBeep(880, 'square', 0.08);
            break;
          }
        }

        if (en.y > 490) enemies.splice(i, 1);
      }

      // Update Stars
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > 480) { s.y = 0; s.x = Math.random() * 640; }
      });
    }

    function draw() {
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, 640, 480);

      // Stars
      ctx.fillStyle = '#94a3b8';
      stars.forEach(s => {
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // Player Ship
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(player.x + player.w / 2, player.y);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.lineTo(player.x + player.w / 2, player.y + player.h - 6);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.closePath();
      ctx.fill();

      // Bullets
      ctx.fillStyle = '#fef08a';
      player.bullets.forEach(b => {
        ctx.fillRect(b.x, b.y, b.w, b.h);
      });

      // Enemies
      enemies.forEach(en => {
        ctx.fillStyle = en.color;
        ctx.beginPath();
        ctx.roundRect(en.x, en.y, en.w, en.h, 6);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(en.x + 6, en.y + 6, 6, 6);
        ctx.fillRect(en.x + en.w - 12, en.y + 6, 6, 6);
      });

      // Grid Lines on bottom
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
      ctx.lineWidth = 1;
      for (let x = 0; x < 640; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 440);
        ctx.lineTo(x, 480);
        ctx.stroke();
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
