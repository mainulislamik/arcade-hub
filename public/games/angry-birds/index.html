<!DOCTYPE>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0">
<title>Angry Birds HTML5</title>
<script type="text/javascript" src="cocos2d.js"></script>
<link rel="stylesheet" type="text/css" href="style.css" />
<script>
function fit() {
  var w = window.innerWidth;
  var h = window.innerHeight;
  if (!w || !h) return;
  var s = Math.min(w / 1000, h / 600);
  var left = Math.max(0, (w - 1000 * s) / 2);
  var top = Math.max(0, (h - 600 * s) / 2);
  var el = document.getElementById('main_div');
  if (el) {
    el.style.position = 'absolute';
    el.style.left = left + 'px';
    el.style.top = top + 'px';
    el.style.transformOrigin = '0 0';
    el.style.transform = 'scale(' + s + ')';
    el.style.webkitTransform = 'scale(' + s + ')';
  }
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function() { setTimeout(fit, 100); });
document.addEventListener('DOMContentLoaded', fit);
fit();
</script>

</head>
<body>
<div id="main_div">
  <div id="frontpage_div">
    <div id="play_button">LOADING...</div>
  </div>

  <div id="level_select_div"></div>

  <div id="game_div">
    <canvas id="viewport" width="2400px" height="600px"></canvas>
    <div id="score_div"></div>
    <div id="smoke_div"></div>
    <div id="win_popup">
      <div id="win_popup_inner" class="popup_inner"></div>
	  	<div id="button_level_select" onclick="show_level_select();"></div>
	   	<div id="button_game_init" onclick="game.init();"></div>
	   	<div id="button_level_up" onclick="level_up();"></div>
    </div>
  
    <div id="lose_popup">
      <div id="lose_popup_inner" class="popup_inner"></div>
	  	<div id="button_level_select_2" onclick="show_level_select();"></div>
	   	<div id="button_game_init_2" onclick="game.init();"></div>
    </div>
  </div>
</div>
<div id="overlay"></div>
</body>
</html>
